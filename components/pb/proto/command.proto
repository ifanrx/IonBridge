  uint32 identifier = 1;
}

message GetStaticAllocatorReq {}
message GetStaticAllocatorResp {
  uint32 identifier = 1;
  uint32 version = 2;
}

message SetPortConfigReq {
  uint32 ports = 1;
  repeated PortConfig configs = 2;
}
message SetPortConfigResp {}

message GetPortConfigReq {
  uint32 version = 1;
}
message GetPortConfigResp {
  repeated PortConfig configs = 1;
}

message SetPortCompatibilitySettingsReq {
  CompatibilitySettings settings = 1;
}
message SetPortCompatibilitySettingsResp {}

message GetPortCompatibilitySettingsReq {}
message GetPortCompatibilitySettingsResp {
  CompatibilitySettings settings = 1;
}

message SetTemperatureModeReq {
  TemperatureMode mode = 1;
}
message SetTemperatureModeResp {}

message SetTemporaryAllocatorReq {
