}
message SetTemporaryAllocatorResp {}

message SubscribePDPcapStreamingReq {
  uint32 port = 1;
  bool subscribe = 2;
}
message SubscribePDPcapStreamingResp {}

message SetPortTypeReq {
  uint32 port = 1;
  PortType port_type = 2;
}
message SetPortTypeResp {}

message SetCustomPdoVoltageReq {
  uint32 port = 1;
  uint32 voltage_mv = 2;
}
message SetCustomPdoVoltageResp {}

message SetCableCompensationReq {
    uint32 port_mask = 1;
    bool disable = 2;
    CableCompensation resistance = 3;
    FixedVoltageOffset voltage_offset = 4;
}
message SetCableCompensationResp {}

message GetCableCompensationReq {
    uint32 port = 1;
}
message GetCableCompensationResp {
    bool enable = 1;
    CableCompensation resistance = 2;
    FixedVoltageOffset voltage_offset = 3;
}

message SetDisplayIntensityReq {
  uint32 intensity = 1;
}
message SetDisplayIntensityResp {}

message SetDisplayModeReq {
  DisplayMode mode = 1;
}
message SetDisplayModeResp {}

message GetDisplayIntensityReq {}
message GetDisplayIntensityResp {
  uint32 intensity = 1;
}

message GetDisplayModeReq {}
message GetDisplayModeResp {
  DisplayMode mode = 1;
}

message SetDisplayFlipReq {
  DisplayFlip flip = 1;
}
message SetDisplayFlipResp {}

message GetDisplayFlipReq {}
message GetDisplayFlipResp {
  DisplayFlip flip = 1;
}

message SetDisplayConfigReq {
  DisplayConfiguration config = 1;
}
message SetDisplayConfigResp {}

message GetDisplayRotationReq {}
message GetDisplayRotationResp {
  DisplayRotation rotation = 1;
}

message SetDisplayRotationReq {
  DisplayRotation rotation = 1;
}
message SetDisplayRotationResp {}

message SetDisplaySetupReq {
  DisplaySetup setup = 1;
}
message SetDisplaySetupResp {}

message GetDisplaySetupReq {}
message GetDisplaySetupResp {
  DisplaySetup setup = 1;
}

message StartTelemetryStreamReq {}
message StartTelemetryStreamResp {}

message StopTelemetryStreamReq {}
message StopTelemetryStreamResp {}

message GetDeviceInfoReq {}
message GetDeviceInfoResp {
  DeviceInfo info = 1;
}

message SetBleStateReq {
  bool enable = 1;
}
message SetBleStateResp {}

message StartOTAReq {
  Version sw3566_version = 1;
  Version fpga_version = 2;
  Version esp32_version = 3;
  bool force = 4;
}

message StartOTAResp {}

message StreamPortStatus {
  uint32 port_status_map = 1;
  repeated PortStatusData ports = 2;
}

message StreamPortPDStatus {
  uint32 port = 1;
  ClientPDStatus pd_status = 2;
}

message StreamDeviceStatus {
  uint32 allocator = 1;
  DisplayConfiguration display_config = 2;
  uint32 device_uptime = 3; // second
  FeatureFlag feature_flag = 4;
  uint32 charging_minutes = 5;
  uint32 power_allocator_param = 6;
  TemperatureMode temperature_mode = 7;
  bool programmer_mode = 8;
}

message StartProgrammerReq {
  Version version = 1;
  string product_family = 2;
}

message StartProgrammerResp {}

message StreamProgrammerStatus {
  bool start = 1;
  bool success = 2;
  ProgrammerState error_reason = 3;
}

message ClearFactoryDMFlagReq {}

message ClearFactoryDMFlagResp {}
