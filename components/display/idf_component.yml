## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  larryli/bsp_generic:
    git: https://github.com/ifanrx/esp-idf_bsp_generic
    version: 40a9293153a5384630f506b4e7d56cd51273297f
    matches:
    - if: $USE_LVGL == 1
  espressif/esp_lv_decoder:
    git: https://github.com/ifanrx/esp-iot-solution.git
    path: components/display/tools/esp_lv_decoder
    version: eaed5961c07c2bdca890e0325c1cf558004b7324
    matches:
    - if: $USE_LVGL == 1
  espressif/esp_mmap_assets:
    version: ^1.3.1
    matches:
    - if: $USE_LVGL == 1
